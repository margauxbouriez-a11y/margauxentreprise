<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion — Margaux Entreprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; background: var(--nuit); padding: 16px; }
    .boite { background: var(--surface); border-radius: 14px; padding: 32px; width: min(380px, 100%); display: grid; gap: 18px; }
    .boite h1 { font-size: 24px; }
    .boite p { margin: -10px 0 0; color: var(--encre-douce); }
    .err { color: var(--danger); font-size: 14px; min-height: 1.4em; margin: -6px 0 0; }
  </style>
</head>
<body>
  <form class="boite" id="f">
    <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#0f2e2a"/><circle cx="10" cy="16" r="4" fill="#e8a33d"/><circle cx="22" cy="10" r="3" fill="#fff"/><circle cx="22" cy="22" r="3" fill="#fff"/><path d="M13.5 14.5 19.5 11M13.5 17.5l6 3.5" stroke="#fff" stroke-width="1.6"/></svg>
    <h1>Ta plateforme</h1>
    <p>Entre ton mot de passe pour accéder au démarchage.</p>
    <label>Mot de passe<input type="password" name="mot_de_passe" autocomplete="current-password" required autofocus></label>
    <div class="err" id="err" role="alert"></div>
    <button class="btn principal" style="justify-content:center">Se connecter</button>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const r = await fetch('/connexion', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ mot_de_passe: e.target.mot_de_passe.value }) });
      if (r.ok) location.href = '/';
      else document.getElementById('err').textContent = (await r.json()).erreur || 'Connexion impossible.';
    });
  </script>
</body>
</html>
